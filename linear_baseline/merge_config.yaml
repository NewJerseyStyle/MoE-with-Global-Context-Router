# Linear Merge Configuration for Qwen3-1.7B Experts
# This creates a baseline merged model using simple linear interpolation
#
# Usage: mergekit-yaml merge_config.yaml ./merged_linear --cuda

merge_method: linear
dtype: float16

slices:
  - sources:
      - model: Qwen/Qwen3-1.7B
        layer_range: [0, 28]
        parameters:
          weight: 0.2
      - model: prithivMLmods/Sculptor-Qwen3_Med-Reasoning
        layer_range: [0, 28]
        parameters:
          weight: 0.2
      - model: gustavecortal/Qwen3-psychological-reasoning-1.7B
        layer_range: [0, 28]
        parameters:
          weight: 0.2

# Tokenizer from base model
tokenizer_source: Qwen/Qwen3-1.7B
